<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Vibes • Spotify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="background"></div>
    
    <div class="sidebar">
        <button class="menu-btn" id="menuBtn">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="player-container">
        <div class="glass-player">
            <div class="track-info">
                <div class="album-art" id="albumArt">
                    <img src="https://picsum.photos/400/400" alt="Album Art">
                </div>
                <div class="track-details">
                    <h2 id="trackName">Shape of You</h2>
                    <p id="artistName">Ed Sheeran</p>
                </div>
            </div>

            <!-- Spotify Embed -->
            <div class="spotify-embed" id="spotifyEmbed"></div>

            <div class="controls">
                <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
            </div>
        </div>
    </div>

    <!-- Любимые треки -->
    <div class="favorites-sidebar" id="favoritesSidebar">
        <div class="favorites-header">
            <h3>Любимые треки</h3>
            <button class="close-btn" id="closeFavorites">✕</button>
        </div>
        <div class="favorites-list" id="favoritesList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
