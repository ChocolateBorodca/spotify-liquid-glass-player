<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Vibes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="background" id="background"></div>
    
    <!-- Меню -->
    <button class="menu-btn" id="menuBtn">
        <i class="fas fa-bars"></i>
    </button>

    <div class="main-content">
        <div class="track-info">
            <h1 id="trackName">snowfall</h1>
            <p id="artistName">Øneheart, reidenshi</p>
        </div>

        <div class="controls">
            <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
            <button class="like-btn" id="likeBtn"><i class="fas fa-heart"></i></button>
        </div>

        <!-- Spotify Embed (маленький) -->
        <div class="spotify-embed" id="spotifyEmbed"></div>
    </div>

    <!-- Любимые -->
    <div class="favorites-sidebar" id="favoritesSidebar">
        <div class="favorites-header">
            <h3>❤️ Любимые треки</h3>
            <button class="close-btn" id="closeFavorites">✕</button>
        </div>
        <div class="favorites-list" id="favoritesList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
